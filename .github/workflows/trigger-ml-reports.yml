name: Trigger private ML Reports

on:
  schedule:
    # Тест: каждая минута (dispatch сработает только на нужной минуте в job)
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sheykink-glitch/ml-reports
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Secret DISPATCH_TOKEN is empty" >&2
            exit 1
          fi
          minute=$(date -u +%M)
          if [ "$minute" != "17" ]; then
            echo "Skip dispatch: minute mismatch (expected 17, got $minute)."
            exit 0
          fi
          echo "Dispatching weekly-reports.yml on sheykink-glitch/ml-reports ..."
          gh workflow run weekly-reports.yml --repo sheykink-glitch/ml-reports
          echo "Done. Check: https://github.com/sheykink-glitch/ml-reports/actions"
