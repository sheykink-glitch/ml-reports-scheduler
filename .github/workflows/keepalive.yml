name: Keep scheduled workflows active

# В public-репозитории GitHub гасит on.schedule через 60 дней без коммитов
# (состояние disabled_inactivity). Из-за этого вторничный сбор отчётов
# молча остановился после 06.10.2026. Еженедельный коммит сбрасывает таймер.

on:
  schedule:
    # Понедельник 04:00 МСК = 01:00 UTC, за сутки до вторничного сбора
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record activity
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$stamp" > .github/last-activity.txt
          git add .github/last-activity.txt
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: keep scheduled workflows active ($stamp)"
          git push
