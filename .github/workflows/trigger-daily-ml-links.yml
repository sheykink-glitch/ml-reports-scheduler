name: Trigger daily ML link report

on:
  schedule:
    # Каждый день 15:00 МСК = 12:00 UTC.
    # День отправки — календарный день запуска по Москве.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report in private repository
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Secret DISPATCH_TOKEN is empty" >&2
            exit 1
          fi
          DAY=$(TZ=Europe/Moscow date +%Y-%m-%d)
          echo "День отправки: ${DAY}"
          gh workflow run daily-ml-links.yml \
            --repo sheykink-glitch/ml-reports \
            -f "day=${DAY}"
          echo "Daily ML link report dispatched."
